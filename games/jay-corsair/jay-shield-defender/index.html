<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Jay Shield Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #6d28d9, #22004d 55%, #080012);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wrap {
      width: min(94vw, 430px);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      text-shadow: 0 0 18px #c084fc;
    }
    .sub { color: #ddd6fe; font-size: 13px; margin-bottom: 10px; }
    #game {
      width: 100%;
      height: 620px;
      max-height: 78vh;
      background: linear-gradient(#190033, #05000d);
      border: 3px solid #a855f7;
      border-radius: 22px;
      box-shadow: 0 0 30px #7e22ce;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
      font-size: 14px;
      font-weight: bold;
      color: #f5f3ff;
    }
    #player {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 24px;
      border-radius: 999px;
      background: linear-gradient(90deg, #c084fc, #22d3ee, #c084fc);
      box-shadow: 0 0 22px #22d3ee;
      z-index: 3;
    }
    #player::after {
      content: "JAY";
      position: absolute;
      left: 50%;
      top: -23px;
      transform: translateX(-50%);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #fff;
    }
    .item {
      position: absolute;
      top: -50px;
      border-radius: 50%;
      z-index: 2;
    }
    .energy {
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #fff, #22d3ee, #7c3aed);
      box-shadow: 0 0 18px #22d3ee;
    }
    .meteor {
      width: 34px;
      height: 34px;
      background: radial-gradient(circle at 30% 30%, #fca5a5, #ef4444, #450a0a);
      box-shadow: 0 0 16px #ef4444;
      border-radius: 45% 55% 50% 50%;
    }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: .65;
      animation: fall 4s linear infinite;
    }
    @keyframes fall { from { transform: translateY(-20px); } to { transform: translateY(650px); } }
    .screen {
      position: absolute;
      inset: 0;
      background: rgba(10, 0, 25, .82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 22px;
      z-index: 10;
    }
    .screen h2 { font-size: 30px; color: #f5d0fe; text-shadow: 0 0 14px #a855f7; }
    .screen p { color: #ddd6fe; line-height: 1.4; }
    button {
      border: none;
      border-radius: 999px;
      padding: 13px 26px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      box-shadow: 0 0 18px #7c3aed;
    }
    .hide { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🛡️ Jay Shield Defender</h1>
    <div class="sub">Move the Jay shield. Catch energy, avoid red meteors.</div>
    <div id="game">
      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Level: <span id="level">1</span></div>
      </div>
      <div id="player"></div>
      <div id="start" class="screen">
        <h2>Protect Jay</h2>
        <p>Catch blue energy for points.<br>Avoid red meteors.<br>Sound effect included.</p>
        <button onclick="startGame()">Start Game</button>
      </div>
      <div id="over" class="screen hide">
        <h2>Game Over</h2>
        <p>Your score: <b id="finalScore">0</b></p>
        <button onclick="startGame()">Play Again</button>
      </div>
    </div>
  </div>

<script>
const game = document.getElementById('game');
const player = document.getElementById('player');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const startScreen = document.getElementById('start');
const overScreen = document.getElementById('over');
const finalScore = document.getElementById('finalScore');

let score = 0, lives = 3, level = 1;
let running = false;
let items = [];
let spawnTimer = 0;
let lastTime = 0;
let audioCtx;

function sound(type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'catch') {
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    } else if (type === 'hit') {
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    } else {
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    }
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  } catch(e) {}
}

function makeStars() {
  document.querySelectorAll('.star').forEach(s => s.remove());
  for (let i = 0; i < 38; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    game.appendChild(s);
  }
}

function startGame() {
  score = 0; lives = 3; level = 1;
  running = true;
  spawnTimer = 0;
  lastTime = performance.now();
  items.forEach(i => i.el.remove());
  items = [];
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  startScreen.classList.add('hide');
  overScreen.classList.add('hide');
  makeStars();
  sound('start');
  requestAnimationFrame(loop);
}

function spawnItem() {
  const el = document.createElement('div');
  const type = Math.random() < 0.72 ? 'energy' : 'meteor';
  el.className = 'item ' + type;
  const size = type === 'energy' ? 30 : 34;
  el.style.left = Math.random() * (game.clientWidth - size) + 'px';
  el.style.top = '-45px';
  game.appendChild(el);
  items.push({ el, type, y: -45, speed: 145 + level * 24 + Math.random() * 80 });
}

function movePlayer(clientX) {
  const rect = game.getBoundingClientRect();
  let x = clientX - rect.left;
  x = Math.max(46, Math.min(game.clientWidth - 46, x));
  player.style.left = x + 'px';
}

game.addEventListener('mousemove', e => movePlayer(e.clientX));
game.addEventListener('touchmove', e => { e.preventDefault(); movePlayer(e.touches[0].clientX); }, { passive: false });
game.addEventListener('touchstart', e => { if (!running && startScreen.classList.contains('hide') === false) startGame(); movePlayer(e.touches[0].clientX); });

document.addEventListener('keydown', e => {
  const current = player.offsetLeft + player.offsetWidth / 2;
  if (e.key === 'ArrowLeft') player.style.left = Math.max(46, current - 32) + 'px';
  if (e.key === 'ArrowRight') player.style.left = Math.min(game.clientWidth - 46, current + 32) + 'px';
});

function collide(a, b) {
  const ar = a.getBoundingClientRect();
  const br = b.getBoundingClientRect();
  return !(ar.right < br.left || ar.left > br.right || ar.bottom < br.top || ar.top > br.bottom);
}

function loop(time) {
  if (!running) return;
  const dt = Math.min((time - lastTime) / 1000, 0.04);
  lastTime = time;
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer = Math.max(0.33, 0.86 - level * 0.055);
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const obj = items[i];
    obj.y += obj.speed * dt;
    obj.el.style.top = obj.y + 'px';

    if (collide(obj.el, player)) {
      if (obj.type === 'energy') {
        score += 10;
        sound('catch');
      } else {
        lives--;
        sound('hit');
        game.animate([{ transform:'translateX(-6px)' }, { transform:'translateX(6px)' }, { transform:'translateX(0)' }], { duration: 160 });
      }
      obj.el.remove();
      items.splice(i, 1);
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      level = Math.floor(score / 100) + 1;
      levelEl.textContent = level;
      if (lives <= 0) endGame();
    } else if (obj.y > game.clientHeight + 50) {
      obj.el.remove();
      items.splice(i, 1);
    }
  }
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  finalScore.textContent = score;
  overScreen.classList.remove('hide');
}

makeStars();
</script>
</body>
</html>
